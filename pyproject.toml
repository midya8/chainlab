[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chainlab"
version = "0.1.0"
description = "Discrete hidden Markov inference, Viterbi and audited Baum-Welch from scratch"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
chainlab = "chainlab.cli:main"

[tool.setuptools.packages.find]
include = ["chainlab*"]
